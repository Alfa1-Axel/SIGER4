<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logos/logo-informatica.png" />
    <link rel="apple-touch-icon" href="/logos/logo-informatica.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#D32F2F" />
    <meta name="description" content="SIGER4 - Sistema Integral de Gestion de la Regional 4 de Bomberos Voluntarios" />
    <title>SIGER4</title>
    <script>
      // Aplica el tema guardado antes del primer paint para evitar el
      // parpadeo claro->oscuro al recargar. Nunca sigue prefers-color-scheme:
      // el tema es siempre una elección manual del usuario (ver useTheme.ts).
      try {
        if (localStorage.getItem('siger4-theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
